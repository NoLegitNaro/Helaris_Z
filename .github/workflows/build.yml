name: Build

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Validate
        run: npm test && npm run lint
        shell: bash

      - name: Build without publishing
        run: npm run dist -- --publish never
        shell: bash

      - name: Upload installers for review
        uses: actions/upload-artifact@v4
        with:
          name: HeraliZ-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
